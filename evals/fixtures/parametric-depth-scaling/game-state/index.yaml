game: "Parametric Depth-Scaling Test Fixture"
tradition: roguelike
description: >
  A self-contained, content-agnostic "wave-survival" depth engine used as the
  cycle-005 acceptance ground. Player power is a flat tuning knob; enemy armor
  and HP scale parametrically with the `wave` progression variable via `model:`
  formulas. All values are self-authored and self-consistent — NO value is
  sourced from outside this repo. Carmack-engine is the motivating inspiration
  only (see README.md); none of its numbers appear here.
created_at: "2026-06-08T00:00:00Z"
last_modified_at: "2026-06-08T00:00:00Z"

design_parameters:
  target_session_length: medium
  target_audience: intermediate
  target_variance: low
  target_lethality: moderate
  target_prep: low
  target_player_count: solo

# The parametric surface: every entity below is a function of this variable.
progression_variable:
  name: wave
  domain: { min: 1, max: 20 }

entity_count:
  stats: 6
  resources: 0
  mechanics: 1
  progression: 1
  entities: 0
  tensions: 0

files:
  - path: stats/player-attack.yaml
    id: player-attack
    depends_on: []
    affects: [mechanics/damage-formula.yaml]
  - path: stats/enemy-armor.yaml
    id: enemy-armor
    depends_on: []
    affects: [mechanics/damage-formula.yaml]
  - path: stats/enemy-hp.yaml
    id: enemy-hp
    depends_on: []
    affects: [progression/encounter-scaling.yaml]
  - path: stats/enemy-attack.yaml
    id: enemy-attack
    depends_on: []
    affects: [progression/encounter-scaling.yaml]
  - path: stats/player-max-hp.yaml
    id: player-max-hp
    depends_on: []
    affects: [progression/encounter-scaling.yaml]
  - path: stats/heal-value.yaml
    id: heal-value
    depends_on: []
    affects: [progression/encounter-scaling.yaml]
  - path: mechanics/damage-formula.yaml
    id: damage-formula
    depends_on: [stats/player-attack.yaml, stats/enemy-armor.yaml]
    affects: [progression/encounter-scaling.yaml]
  - path: progression/encounter-scaling.yaml
    id: encounter-scaling
    depends_on:
      - stats/enemy-hp.yaml
      - stats/enemy-attack.yaml
      - stats/player-max-hp.yaml
      - stats/heal-value.yaml
      - mechanics/damage-formula.yaml
    affects: []

graph_integrity:
  resolved_references: 10
  stub_count: 0
  stubs: []
  orphaned: []
  circular: []
  most_depended_on:
    - path: mechanics/damage-formula.yaml
      dependents: 1
