created_at: "2026-06-08T00:00:00Z"
last_modified_by: attune
last_modified_at: "2026-06-08T00:00:00Z"

tunability: engine-default

model:
  variable: wave
  domain: { min: 1, max: 20 }
  formula: "120"                  # flat
  notes: "Threshold reference: incoming_per_kill > 120 first occurs at wave 16."
