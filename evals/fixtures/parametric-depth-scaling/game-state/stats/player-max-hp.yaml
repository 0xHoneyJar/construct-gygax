id: player-max-hp
name: "Player Max HP"
type: stats
description: >
  Player's maximum hit points. Flat. Serves as the declared threshold for the
  incoming-damage-per-kill metric (incoming > maxHP = a fight the player cannot
  survive in one engagement).
tradition: roguelike
tags: [survival, engine, parametric, tuning-surface]
depends_on: []
affects: [progression/encounter-scaling.yaml]
